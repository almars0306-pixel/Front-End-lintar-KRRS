<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <div class="auth">
    <aside class="auth__side">
      <div class="auth__brand">Front-End KRRS</div>
      <div>
        <img src="../assets/logo.png" alt="Logo Front-End KRRS" width="550" height="500">
        <h1>Buat akun barumu.</h1>
        <p>Isi data di samping, lalu masuk dengan akun yang baru dibuat.</p>
      </div>
    </aside>

    <main class="auth__main">
      <div class="card">
        <h2>Daftar</h2>
        <p class="lead">Semua kolom wajib diisi.</p>

        <form data-auth="register" novalidate>
          <div class="field">
            <label for="name">Nama lengkap</label>
            <div class="control">
              <input id="name" name="name" type="text" autocomplete="name"
                     data-rule="name" aria-describedby="name-error">
            </div>
            <p class="error" id="name-error" role="alert"></p>
          </div>

          <div class="field">
            <label for="email">Email</label>
            <div class="control">
              <input id="email" name="email" type="email" autocomplete="email"
                     data-rule="email" aria-describedby="email-error" placeholder="nama@email.com">
            </div>
            <p class="error" id="email-error" role="alert"></p>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="control">
              <input id="password" name="password" type="password" autocomplete="new-password"
                     data-rule="password" aria-describedby="password-error">
              <button type="button" class="toggle" data-toggle="password" aria-pressed="false">Tampilkan</button>
            </div>
            <p class="error" id="password-error" role="alert"></p>
          </div>

          <div class="field">
            <label for="confirm">Konfirmasi password</label>
            <div class="control">
              <input id="confirm" name="confirm" type="password" autocomplete="new-password"
                     data-rule="confirm" aria-describedby="confirm-error">
              <button type="button" class="toggle" data-toggle="confirm" aria-pressed="false">Tampilkan</button>
            </div>
            <p class="error" id="confirm-error" role="alert"></p>
          </div>

          <button type="submit" class="btn"><a href="login.html"></a> Buat akun</button>
          <p class="status" role="status" aria-live="polite"></p>
        </form>

        <p class="switch">Sudah punya akun? <a href="login.html">Masuk</a></p>
      </div>
    </main>
  </div>
  <script src="auth.js"></script>
</body>
</html>
