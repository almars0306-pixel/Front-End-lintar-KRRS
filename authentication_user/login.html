<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Auth.css">
</head>
<body>
  <div class="auth">
    <aside class="auth__side">
      <div class="auth__brand">Front-End KRRS</div>
      <div>
        <img src="../assets/logo.png" alt="Logo Front-End KRRS" width="550" height="500">
        <h1>Selamat datang kembali.</h1>
        <p>Masuk untuk melanjutkan ke akunmu.</p>
      </div>
    </aside>

    <main class="auth__main">
      <div class="card">
        <h2>Masuk</h2>
        <p class="lead">Gunakan email dan password yang terdaftar.</p>

        <form data-auth="login" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <div class="control">
              <input id="email" name="email" type="email" autocomplete="email"
                     data-rule="email" aria-describedby="email-error" placeholder="nama@email.com">
            </div>
            <p class="error" id="email-error" role="alert"></p>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="control">
              <input id="password" name="password" type="password" autocomplete="current-password"
                     data-rule="required" aria-describedby="password-error">
              <button type="button" class="toggle" data-toggle="password" aria-pressed="false">Tampilkan</button>
            </div>
            <p class="error" id="password-error" role="alert"></p>
          </div>

          <button type="submit" class="btn">Masuk</button>
          <p class="status" role="status" aria-live="polite"></p>
        </form>

        <p class="switch">Belum punya akun? <a href="register.html">Daftar</a></p>
      </div>
    </main>
  </div>
  <script src="Auth.js"></script>
</body>
</html>
